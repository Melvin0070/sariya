plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.arcorecheck'
version = '0.1.0'

android {
  namespace "expo.modules.arcorecheck"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ViroReact ships the ARCore client at runtime; compile against the API only.
  compileOnly 'com.google.ar:core:1.43.0'
}
